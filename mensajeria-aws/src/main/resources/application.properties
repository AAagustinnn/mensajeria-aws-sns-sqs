spring.application.name=mensajeria-aws
spring.cloud.aws.region.static=us-east-1

# --- Actividad 2: configuracion centralizada (ningun nombre de cola va en el codigo) ---
mensajeria.cola-ordenes=ordenes-q
mensajeria.dlq-ordenes=ordenes-dlq
mensajeria.topico-notificaciones=notificaciones
# true = "Cliente 1" falla con ErrorTransitorio. Para reprocesar la DLQ (Act. 3) cambiar a false y reiniciar.
mensajeria.simular-fallo=true

# --- Actividad 2 seccion 7 / Actividad 3: concurrencia (equivalente a prefetch) ---
spring.cloud.aws.sqs.listener.max-concurrent-messages=1
# ERROR 3 corregido: max-messages-per-poll vale 10 por defecto y Spring Cloud AWS exige
# max-messages-per-poll <= max-concurrent-messages; sin esta linea la app NO arranca.
# Si cambias max-concurrent-messages a 10, puedes subir esta tambien a 10.
spring.cloud.aws.sqs.listener.max-messages-per-poll=1
